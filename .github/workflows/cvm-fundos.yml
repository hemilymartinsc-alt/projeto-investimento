name: CVM - Coletar Cadastro de Fundos

on:
  workflow_dispatch:
  schedule:
    # 10:30 UTC = 07:30 em Brasília, de segunda a sexta.
    - cron: "30 10 * * 1-5"

permissions:
  contents: read

concurrency:
  group: cvm-fundos
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Testar coletor CVM
        run: python -m pytest -q tests/test_coletar_cvm_fundos.py

      - name: Coletar cadastro oficial de fundos da CVM
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.jobs.coletar_cvm_fundos_operacional
