name: B3 - Coletar Programas de BDR

on:
  workflow_dispatch:
  schedule:
    # 11:10 UTC = 08:10 em Brasília (UTC-3), de segunda a sexta.
    - cron: "10 11 * * 1-5"

permissions:
  contents: read

concurrency:
  group: b3-bdr-programas
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Testar coletor BDR
        run: python -m pytest -q tests/test_coletar_b3_programas_bdr.py

      - name: Coletar programas oficiais de BDR do Banco B3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.jobs.coletar_b3_programas_bdr
