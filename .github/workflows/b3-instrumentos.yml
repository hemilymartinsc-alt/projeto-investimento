name: B3 - Validar e Classificar Instrumentos

on:
  workflow_dispatch:
  schedule:
    # 07:30 UTC = 04:30 em Brasília (UTC-3), de segunda a sexta.
    - cron: "30 7 * * 1-5"

permissions:
  contents: read

concurrency:
  group: b3-instrumentos
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Validar e classificar instrumentos da B3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.jobs.validate_b3_instrumentos
