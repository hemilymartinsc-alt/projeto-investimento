name: CVM - Demonstrações Financeiras

on:
  workflow_dispatch:
    inputs:
      ano:
        description: "Ano opcional, ex.: 2025"
        required: false
        type: string

      documento:
        description: "Documento CVM"
        required: true
        default: "AMBOS"
        type: choice
        options:
          - AMBOS
          - DFP
          - ITR

  schedule:
    # Segunda-feira às 08:30 no horário de Brasília.
    # A CVM atualiza os conjuntos semanalmente.
    - cron: "30 11 * * 1"

permissions:
  contents: read

concurrency:
  group: demonstracoes-cvm
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Coletar demonstrações CVM
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANO_MANUAL: ${{ inputs.ano }}
          DOCUMENTO_MANUAL: ${{ inputs.documento }}
        run: |
          if [ -n "$ANO_MANUAL" ]; then
            if [ -n "$DOCUMENTO_MANUAL" ]; then
              python -m src.jobs.coletar_demonstracoes_cvm \
                --ano "$ANO_MANUAL" \
                --documento "$DOCUMENTO_MANUAL"
            else
              python -m src.jobs.coletar_demonstracoes_cvm \
                --ano "$ANO_MANUAL"
            fi
          else
            if [ -n "$DOCUMENTO_MANUAL" ]; then
              python -m src.jobs.coletar_demonstracoes_cvm \
                --documento "$DOCUMENTO_MANUAL"
            else
              python -m src.jobs.coletar_demonstracoes_cvm
            fi
          fi
