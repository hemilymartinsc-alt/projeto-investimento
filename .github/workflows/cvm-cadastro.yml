name: CVM - Cadastro de Companhias

on:
  workflow_dispatch:
  schedule:
    # 06:20 UTC = 03:20 em Brasília (UTC-3), de segunda a sexta.
    - cron: "20 6 * * 1-5"

permissions:
  contents: read

concurrency:
  group: cvm-cadastro
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Coletar cadastro oficial da CVM
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.jobs.collect_cvm_cadastro
