name: Motor - Valuation

on:
  workflow_dispatch:

  schedule:
    # Segunda-feira às 12:00 no horário de Brasília.
    # Métricas do motor rodam antes, às 11:00.
    - cron: "0 15 * * 1"

permissions:
  contents: read

concurrency:
  group: motor-valuation-v1
  cancel-in-progress: false

jobs:
  calcular:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Calcular valuation e resultados
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m src.jobs.calcular_valuation
