name: Motor - Fundamentos CVM

on:
  workflow_dispatch:

  schedule:
    # Segunda-feira às 10:00 no horário de Brasília.
    # Roda depois da atualização semanal das demonstrações CVM.
    - cron: "0 13 * * 1"

permissions:
  contents: read

concurrency:
  group: fundamentos-cvm
  cancel-in-progress: false

jobs:
  calcular:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Calcular fundamentos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python -m src.jobs.calcular_fundamentos
